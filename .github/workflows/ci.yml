name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/packetpilot_ci
      OWNER_USERNAME: ci
      OWNER_PASSWORD: ci-only-owner-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start native PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'ci-only-password';"
          sudo -u postgres createdb packetpilot_ci
      - run: pip install -r backend/requirements.txt
      - run: python scripts/check_secrets.py
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m ruff check backend
      - run: python -m pytest -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
